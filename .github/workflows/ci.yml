name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Example gate
        run: |
          witnessforge generate examples/claims/claim.cpy examples/claims/mapping.yaml -o out --min-score 1.0
          witnessforge verify examples/claims/claim.cpy examples/claims/mapping.yaml \
            --input out/witnesses.dat --actual out/expected.jsonl
